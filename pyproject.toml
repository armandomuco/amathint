[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amathint"
version = "1.0.0"
description = "Amathint: canonical Albanian Mathematics Ditare lesson generation pipeline"
requires-python = ">=3.9"
dependencies = [
  "anthropic",
  "fastapi",
  "openpyxl",
  "pydantic",
  "python-docx",
  "uvicorn",
]

[project.scripts]
amathint = "ditare.cli:main"
ditare = "ditare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
